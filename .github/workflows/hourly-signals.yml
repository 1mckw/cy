name: Hourly Crypto Alerts (Bybit TOP50)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hourly-signals.yml"
      - "scan_signals.py"
      - "universe.py"
      - "static/**"
      - "ardr.py"
      - "trendlines.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-crypto-alerts
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan Bybit TOP50 contracts
        if: github.event_name != 'push'
        id: scan
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python -u scan_signals.py

      - name: Commit signal report
        if: steps.scan.outcome == 'success' && github.event_name != 'push'
        run: |
          git add signals/latest.json signals/latest.html signals/index.html signals/chart-packs.json signals/universe-cache.json
          if git diff --staged --quiet; then
            echo "No signal file changes"
            exit 0
          fi
          git commit -m "chore: update crypto hourly touch alerts (Bybit TOP50)"
          git pull --rebase origin main || true
          git push origin main
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Prepare Pages site
        if: always()
        run: |
          test -f signals/latest.html || { echo "Missing signals/latest.html"; exit 1; }
          mkdir -p _site
          cp signals/latest.html _site/index.html
          cp signals/latest.json _site/latest.json
          cp signals/chart-packs.json _site/chart-packs.json
          touch _site/.nojekyll
          python -c "import json; print('Deploying report:', json.load(open('signals/latest.json', encoding='utf-8'))['generated_at'])"
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo "::warning::Scan failed; deploying last committed report"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site

  deploy:
    needs: scan
    if: always() && needs.scan.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Retry deploy (GitHub 429/5xx)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
